<!DOCTYPE html>
<html lang="ptbr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Formulario</title>
</head>

<body>
    <header>

    </header>

    <main>
        <form>
            <div id="campo-form">
                <div class="campos">
                    <p class="titleform">FORMULÁRIO</p>
                </div>

                <div class="campos">
                    <p>Descreva as caracteristicas e marque os opcionaisque ele possui</p>
                </div>

                <!--inicio dos campos de entrada de dados-->
                <div class="campos">
                    <label for="titulo_anuncio">Titulo do anuncio *</label>
                    <input type="text" id="titulo_anuncio" name="titulo_anuncio"
                        placeholder="Um titulo para seu anuncio" minlength="1" maxlength="30" required>
                </div>

                <div class="campos">
                    <label for="preco">Preço *</label>
                    <input type="number" id="preco" name="preco" placeholder="Defina o preço" minlength="1"
                        maxlength="30" required>
                </div>

                <div class="campos">
                    <label for="descricao">Descrição *</label>
                    <textarea name="descricao" id="descricao" placeholder="Aqui você coloca os detalhes do veiculo, por exemplo : se ele tem algum arranhão.
                    " required></textarea>
                </div>

                <div class="campos">
                    <label for="marca">Marca *</label>
                    <input type="text" id="marca" name="marca" placeholder="Digite a marca do veiculo" required>
                </div>

                <div class="campos">
                    <label for="marca">Modelo *</label>
                    <input type="text" id="marca" name="marca" placeholder="Digite a marca do veiculo" required>
                </div>

                <div class="campos">
                    <label for="km">Kilometragem *</label>
                    <input type="text" id="km" name="km" placeholder="Digite a marca do veiculo" required>
                </div>

                <div class="campos">
                    <label for="data">Data de compra *</label>
                    <input type="date" id="data" name="data" placeholder="Digite a marca do veiculo" required>
                </div>

                <div class="campos-2">
                    <div class="campo-radio">
                        <div id="tipo_cambio">
                            <label>Tipo de cambio : *</label>

                            <input type="radio" id="manual" name="cambio" value="manual">
                            <label for="manual">Manual</label>

                            <input type="radio" id="automatico" name="cambio" value="automatico">
                            <label for="automatico">Automático</label>
                        </div>
                    </div>
                </div>

                <div class="campos-2">
                    <div class="campo-select">
                        <div class="campo-check">
                            <div id="title-checkbox">
                                <label id="title-op">Opcionais : *</label>
                            </div>
                            <ul>
                                <li>
                                    <input type="checkbox" id="airbag" name="opcionais[]" value="airbag">
                                    <label for="airbag">Airbag</label>
                                </li>
                            </ul>
                            <ul>
                                <li>
                                    <input type="checkbox" id="alarme" name="opcionais[]" value="alarme">
                                    <label for="alarme">Alarme</label>
                                </li>
                            </ul>
                            <ul>
                                <li>
                                    <input type="checkbox" id="arCondicionado" name="opcionais[]"
                                        value="arCondicionado">
                                    <label for="arCondicionado">Ar Condicionado</label>

                                </li>
                            </ul>
                            <ul>
                                <li>
                                    <input type="checkbox" id="cameraDere" name="opcionais" value="cameraDere">
                                    <label for="cameraDere">Camera de Ré</label>
                                </li>
                            </ul>
                        </div>

                        <div class="campo-check">
                            <ul>
                                <li>
                                    <input type="checkbox" id="assistente" name="opcionais[]" value="assistente">
                                    <label for="airbag">Assistente 24H</label>
                                </li>
                            </ul>
                            <ul>
                                <li>
                                    <input type="checkbox" id="partidaKeyless" name="opcionais[]"
                                        value="partidaKeyless">
                                    <label for="partidaKeyless">Partida Keyless</label>
                                </li>
                            </ul>
                            <ul>
                                <li>
                                    <input type="checkbox" id="intregracaoCelular" name="opcionais[]"
                                        value="intregracaoCelular">
                                    <label for="arCondicionado">Integração com Celular</label>

                                </li>
                            </ul>
                            <ul>
                                <li>
                                    <input type="checkbox" id="bancoCouro" name="opcionais[]" value="bancoCouro">
                                    <label for="bancoCouro">Banco de Couro</label>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="campo-check">
                    <div id="title-file">
                        <label id="title-op">Fotos do Carro : *</label>
                    </div>
                    <div id="campo-img">
                        <input type="file" multiple accept="image/png, image/jpg" id="images" name="images" required />
                    </div>
                    <div id="campo-botao">
                        <input type="submit" value="Enviar" class="botao-enviar">
                    </div>
                </div>

            </div>

        </form>
    </main>
</body>

</html>
